<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080914">
<meta name="description" content="NEON CITY — мобильная киберпанк-игра от третьего лица">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<title>NEON CITY</title>
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="brand"><span class="mark">N</span><div><b>NEON CITY</b><small>THIRD PERSON // MOBILE</small></div></div>
    <div class="readouts"><div><small>РЕЖИМ</small><b id="mode">ПЕШЕХОД</b></div><div><small>СКОРОСТЬ</small><b id="speed">0 KM/H</b></div></div>
  </header>
  <main id="stage">
    <canvas id="game" aria-label="Игровой экран NEON CITY"></canvas>
    <div class="mission"><small>ЗАДАНИЕ 01</small><b id="mission">Найди свой внедорожник</b></div>
    <div class="hint" id="hint">Подойди к чёрному внедорожнику и нажми E</div>
    <div class="controls">
      <div class="stick" id="stick"><div class="stick-ring"><div class="knob" id="knob"></div></div></div>
      <div class="actions">
        <button id="run" class="run">⇧<small>БЕГ</small></button>
        <button id="interact" class="interact">E<small id="actionLabel">МАШИНА</small></button>
      </div>
    </div>
    <div class="look">WASD / стрелки · E — сесть или выйти</div>
  </main>
  <footer><i></i> НОЧНОЙ РАЙОН НЕОН-СИТИ <span>•</span> СВОБОДНОЕ ПЕРЕМЕЩЕНИЕ</footer>
</div>
<script src="game.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body></html>
